name: Deploy GitHub Pages redirect

on:
  push:
    branches: [main]
    paths:
      - "github-pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Public URL of the Vercel-hosted app (no trailing slash).
  # Override without editing this file by setting the repository variable PICKLE_TIME_URL.
  PICKLE_TIME_URL: ${{ vars.PICKLE_TIME_URL || 'https://pickle-time-live.vercel.app' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          url="${PICKLE_TIME_URL%/}"
          mkdir -p _site
          cp -R github-pages/. _site/
          sed -i "s|__PICKLE_TIME_URL__|${url}|g" _site/*.html
          if grep -rq "__PICKLE_TIME_URL__" _site; then
            echo "Placeholder was not replaced" >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Deploying from a separate job ensures the artifact is finalized before deploy-pages looks it up.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
